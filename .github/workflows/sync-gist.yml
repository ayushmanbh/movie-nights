name: Sync Movies from Gist

on:
  # Schedule to run at Midnight and Noon everyday 
  schedule:
    - cron: '0 0,12 * * *'
  
  # Allow manual trigger from the GitHub Actions UI
  workflow_dispatch:

jobs:
  update-movies:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required for git-auto-commit-action

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: 'dev'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Movie Generator Job
        env:
          MOVIES_TXT_URL: ${{ secrets.MOVIES_TXT_URL }}
        run: npm run generate-movies

      - name: Auto-Commit Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: ${{ env.CUSTOM_COMMIT_MSG || '[Bot] Automated sync with movies.txt gist' }}
          file_pattern: src/data/movies.json
          branch: dev
          commit_user_name: 'github-actions[bot]'
          commit_user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_author: 'github-actions[bot] <github-actions[bot]@users.noreply.github.com>'
